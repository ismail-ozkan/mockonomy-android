# Tester distribution — debug APK → Firebase App Distribution (App Tester).
#
# A fast feedback channel, independent of the Play release. The Play workflow is separate:
# `.github/workflows/release.yml` (signed AAB → internal testing).
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions):
#   FIREBASE_APP_ID                # e.g. 1:123456789:android:abc123 (not secret; kept as a secret for convenience)
#   FIREBASE_SERVICE_ACCOUNT_JSON  # the FULL content of the service account key
#
# OPTIONAL:
#   DEBUG_KEYSTORE_BASE64          # a fixed debug key — without it every run is signed
#                                  # with a different key and testers have to uninstall
#                                  # the app on every release.

name: Distribute
on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Firebase tester group alias(es), comma-separated'
        default: 'testers'
      notes:
        description: 'Release notes (the last commit title is used when empty)'
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: distribute-${{ github.ref }}

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner is ephemeral: ~/.android/debug.keystore is regenerated on every run, so
      # the signature changes and App Tester asks to "uninstall and reinstall". If the secret
      # is set a fixed key is installed; otherwise the build still works and a warning is shown.
      - name: Install the fixed debug keystore (if any)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${DEBUG_KEYSTORE_BASE64:-}" ]]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Fixed debug keystore installed."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set — this run is signed differently from previous ones; testers have to uninstall and reinstall the app."
          fi

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          NOTES="${INPUT_NOTES:-}"
          if [[ -z "$NOTES" ]]; then
            NOTES="$(git log -1 --pretty=%s)"
          fi
          printf '%s\n\n%s @ %s\n' "$NOTES" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" \
            > "$RUNNER_TEMP/release-notes.txt"
          cat "$RUNNER_TEMP/release-notes.txt"

      - name: Write the service account key to a file
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set"
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      # FIREBASE_TOKEN (firebase login:ci) is deprecated; a service account + ADC is the
      # officially recommended path. The firebase-tools major version is pinned — minors float.
      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GROUPS: ${{ inputs.groups || 'testers' }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_APP_ID:-}" ]]; then
            echo "::error::FIREBASE_APP_ID is not set"
            exit 1
          fi
          npx --yes firebase-tools@15 appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$GROUPS" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"

      - name: Upload the APK as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
