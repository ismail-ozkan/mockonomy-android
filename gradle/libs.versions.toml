[versions]
# Build tools
# Kotlin is aligned with the KGP version bundled in AGP 9 (AGP 9.3.1 → KGP 2.2.10).
# With AGP 9 Kotlin support moved into AGP; the separate kotlin-android plugin cannot be
# applied. Instead of forcing a version we use the one AGP brings.
agp = "9.3.1"
kotlin = "2.2.10"
# KSP 2.3.x is versioned independently and is compatible with AGP 9's built-in Kotlin.
# The old "<kotlin>-<ksp>" style (e.g. 2.2.10-2.0.2) uses the kotlin.sourceSets DSL and
# does not work with AGP 9.
ksp = "2.3.11"
hilt = "2.60.1"

# SDK levels
minSdk = "26"
targetSdk = "36"
compileSdk = "37"

# Libraries
composeBom = "2026.08.00"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
okio = "3.18.1"
okhttp = "5.4.0"
ktor = "3.5.2"
room = "2.8.4"
junitJupiter = "6.1.3"
# Build-only plugin (open source license list) — the runtime library is not used,
# see the `aboutLibraries` block in app/build.gradle.kts
aboutLibraries = "15.2.0"

coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
hiltNavigationCompose = "1.4.0"
datastore = "1.2.1"
navigationCompose = "2.9.8"
splashscreen = "1.2.0"

[libraries]
# --- :engine (pure Kotlin/JVM — NO Android dependency) ---
# Used instead of java.* to keep the Kotlin Multiplatform path open
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }

# --- :server ---
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
# Proxy client: the OkHttp engine, with the same Ktor coroutine model as the server
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
# Test only: for an HTTPS stub target with a self-signed certificate.
# The CIO server engine does not support an SSL connector; the TLS stub uses Netty.
ktor-network-tls-certificates = { module = "io.ktor:ktor-network-tls-certificates", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# --- :data ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- :app ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# For collectAsStateWithLifecycle
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
# Backport of the Android 12+ splash API — Theme.SplashScreen comes from here
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# --- DI ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Test ---
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# In Android modules the framework variant of kotlin-test is not selected automatically;
# we set up the JUnit 5 variant and platform explicitly. On the :engine (pure JVM) side
# the Kotlin plugin handles this itself.
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
# NOTE: there is NO org.jetbrains.kotlin.android — since AGP 9 Kotlin support is built
# into AGP. In Android modules Kotlin settings go into the android { kotlin { } } block.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }
